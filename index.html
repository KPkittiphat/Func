<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Functional Jukebox: เพลงสไตล์โมเดิร์น</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-lg sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">Functional Jukebox 🎧</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#songs"><i class="bi bi-music-note-list"></i> เพลงทั้งหมด</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#about"><i class="bi bi-gear-wide-connected"></i> หลักการ FP</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <header class="hero-section text-white text-center py-5">
        <div class="container">
            <h1 class="display-4 fw-bolder">The Modern Vibe.</h1>
            <p class="lead">ค้นพบเพลงใหม่ด้วยโค้ดที่บริสุทธิ์และทันสมัย</p>
        </div>
    </header>

    <main class="container my-5">
        <section id="songs" class="mb-5">
            <h2 class="text-center mb-4 text-primary fw-bold">🔥 เพลงยอดนิยมประจำสัปดาห์</h2>
            
            <div class="row mb-4 p-3 bg-light rounded shadow-sm">
                <div class="col-md-6 mb-3">
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                        <input type="text" id="search-input" class="form-control form-control-lg" placeholder="ค้นหาเพลง / ศิลปิน">
                    </div>
                </div>
                <div class="col-md-6 mb-3">
                    <select id="genre-filter" class="form-select form-select-lg">
                        <option value="all">ทุกแนวเพลง</option>
                        <option value="pop">Pop</option>
                        <option value="rock">Rock</option>
                        <option value="hiphop">Hip-Hop</option>
                        <option value="jazz">Jazz</option>
                    </select>
                </div>
            </div>

            <div id="song-list" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
            </div>
        </section>

        <hr class="my-5">

     
    </main>

    

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
